[package]
name = "hardviz-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Tauri-independent core for HardwareVisualizer (sensor collection, persistence, event bus)"
authors = ["@shm11C3"]

# Intentionally has no `tauri` dependency. The Cargo dependency graph enforces
# that no `use tauri::*;` can appear under `core/src/`.

[lib]
name = "hardviz_core"
path = "src/lib.rs"

[features]
default = []
duckdb-archive = ["dep:duckdb"]

[dependencies]
tokio = { version = "1.52.3", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
chrono = "0.4.44"
regex = "1.12.3"
async-trait = "0.1"
sysinfo = "0.39.3"
tempfile = "3.27.0"
hmac = "0.12.1"
sha2 = "0.10.9"
getrandom = "0.4.2"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "chrono",
    "migrate",
] }
duckdb = { version = "=1.10505.0", default-features = false, features = [
    "bundled",
], optional = true }

[target.'cfg(windows)'.dependencies]
# External Component Setup (ADR 0023) downloads pinned upstream release
# assets and extracts module files. The TLS stack mirrors what
# tauri-plugin-updater already compiles into the App (rustls + ring), so no
# second TLS implementation enters the binary; `rustls` is listed directly so
# the crypto provider is present when `hardviz-core` is built alone.
reqwest = { version = "0.13.3", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
zip = { version = "6.0.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
wmi = "0.18.4"
dxgi = "0.1.7"
winapi = { version = "0.3", features = [
    "dxgi",
    "setupapi",
    "devguid",
    "devpkey",
    "devpropdef",
] }
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
nvapi = "=0.1.4"
libloading = "0.9"
# SwitchBot Meter ambient source (#2044). Windows-only because Windows is
# the verification platform; the decode and cache it feeds are portable.
# MIT / Apache-2.0 / BSD-3-Clause, actively released.
btleplug = "0.13.0"
# Consuming btleplug's advertisement `Stream`. Already in its own
# dependency tree, so this adds an import rather than a new library.
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ipnet = "2.12.0"
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10.1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
