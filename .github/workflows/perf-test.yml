name: "Performance Test"

on:
  schedule:
    - cron: "0 18 * * *" # Daily at 03:00 JST (18:00 UTC)
  workflow_dispatch:

permissions: read-all

jobs:
  perf-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: xvfb

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-key: perf-test

      - name: Cache perf-monitor target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: perf-monitor/target
          key: perf-monitor-${{ runner.os }}-${{ hashFiles('perf-monitor/Cargo.toml') }}
          restore-keys: |
            perf-monitor-${{ runner.os }}-

      - name: Build perf-monitor
        run: cargo build --release --manifest-path perf-monitor/Cargo.toml

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles app -- --profile ci

      - name: Build Tauri app
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-bundle -- --profile ci

      - name: Run performance test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum \
            ./perf-monitor/target/release/perf-monitor \
              --binary target/ci/hardware-visualizer \
              --config perf-thresholds.toml \
              --output json \
            > perf-results.json

      - name: Run performance test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./perf-monitor/target/release/perf-monitor \
            --binary "target/ci/bundle/macos/HardwareVisualizer.app/Contents/MacOS/hardware-visualizer" \
            --config perf-thresholds.toml \
            --output json \
          > perf-results.json

      - name: Run performance test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./perf-monitor/target/release/perf-monitor.exe \
            --binary target/ci/hardware-visualizer.exe \
            --config perf-thresholds.toml \
            --output json \
          > perf-results.json

      - name: Show results
        if: always()
        shell: bash
        run: cat perf-results.json 2>/dev/null || echo "No results file"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-results-${{ matrix.platform }}
          path: perf-results.json

  notify:
    needs: perf-test
    if: failure()
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Create or update issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = ['type:performance', 'status:regression', 'source:performance-test'];
            const title = 'Performance test threshold exceeded';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const labelDetails = {
              'type:performance': {
                color: '17e0f0',
                description: 'Runtime, build, bundle, memory, or responsiveness work',
              },
              'status:regression': {
                color: 'e11d48',
                description: 'Known regression from a previous working state',
              },
              'source:performance-test': {
                color: 'ededed',
                description: 'Created by the scheduled performance workflow',
              },
            };

            // Ensure labels exist
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  ...labelDetails[label],
                });
              }
            }

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels.join(','),
              state: 'open',
              per_page: 1,
            });

            const body = `Performance test failed on ${new Date().toISOString().split('T')[0]}.\n\n` +
              `**Workflow run:** ${runUrl}\n\n` +
              `Download the \`perf-results-*\` artifacts from the workflow run for details.`;

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            }
