name: Auto update Tauri dependencies

on:
  workflow_dispatch:
  schedule:
    # Twice monthly on the 8th and 22nd at 09:00 JST (00:00 UTC)
    - cron: "0 0 8,22 * *"

permissions: read-all

concurrency:
  group: auto-update-tauri
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-key: auto-update-tauri
          cache-targets: "false"

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/0b24824336e2b3800b0f89d9e08b2c08bfa3dcdd/install-from-binstall-release.sh | bash

      - name: Install cargo-edit
        run: cargo binstall cargo-edit --no-confirm

      - name: Run Tauri dependency updater
        run: bash .github/scripts/tauri-updater.sh

      - name: Check for effective Tauri dependency updates
        id: tauri-deps
        run: node .github/scripts/check-tauri-deps-changed.ts HEAD --worktree

      - name: Discard npm changes without a Tauri npm update
        if: steps.tauri-deps.outputs.npm_changed != 'true'
        run: git restore -- package.json package-lock.json

      - name: Discard Cargo changes without a Tauri crate update
        if: steps.tauri-deps.outputs.cargo_changed != 'true'
        run: git restore -- Cargo.lock src-tauri/Cargo.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore(deps): update tauri dependencies"
          title: "chore(deps-tauri): update tauri dependencies"
          body: |
            This PR was created automatically by the Tauri dependency updater.

            - Updated `@tauri-apps/*` npm packages to latest
            - Updated `tauri`, `tauri-build`, and `tauri-plugin-*` Cargo crates
            - Regenerated lockfiles when Tauri dependency versions changed

            > This workflow runs twice monthly (8th and 22nd, 09:00 JST) and is separate from Dependabot,
            > which ignores Tauri-related packages.
          branch: chore/auto-tauri-update
          delete-branch: true
          labels: |
            change:deps
            area:tauri
            source:automation
          signoff: false
