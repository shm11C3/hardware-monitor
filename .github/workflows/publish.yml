name: "Publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      release-id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must be run on a tag ref." >&2
            exit 1
          fi

          release_tag="${GITHUB_REF_NAME}"
          is_prerelease=false
          if [[ "$release_tag" == *-* ]]; then
            is_prerelease=true
          fi

          echo "Looking for release with tag ${release_tag}..."
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"${release_tag}\") | .id" \
              | head -n 1
          )"

          if [ -z "$release_id" ]; then
            echo "No release found. Creating draft release ${release_tag}..."
            release_id="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$release_tag" \
                -f name="$release_tag" \
                -F draft=true \
                -F prerelease="$is_prerelease" \
                -F generate_release_notes=true \
                --jq ".id"
            )"
          else
            echo "Using existing release ${release_id}."
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    env:
      # Toggle Windows code signing via the repository variable of the same name
      # (Settings → Secrets and variables → Actions → Variables). Defaults to off.
      ENABLE_WINDOWS_SIGNING: ${{ vars.ENABLE_WINDOWS_SIGNING || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            os-name: "windows"
          - platform: "ubuntu-22.04"
            args: ""
            os-name: "linux"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --skip-stapling"
            os-name: "macos-aarch64"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin --skip-stapling"
            os-name: "macos-x64"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/setup-linux-deps
        with:
          extra-packages: "libfuse2 libappindicator3-dev patchelf"

      - name: Fix linuxdeploy permissions
        if: matrix.platform == 'ubuntu-22.04'
        run: chmod +x ./src-tauri/target/release/bundle/appimage/linuxdeploy-*.AppImage || true

      - name: Unset problematic env vars
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          unset GTK_PATH
          unset LD_LIBRARY_PATH

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          setup-safe-chain: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          targets: ${{ matrix.rust-targets || '' }}
          cache-key: publish

      - name: Generate licenses.json
        run: npx license-checker --production --json > licenses.json

      - name: Check licenses
        run: node --experimental-strip-types .github/scripts/check-licenses.ts licenses.json

      - name: Export VERSION for later steps
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Update tauri.conf.json using Node.js script
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"      # v1.x.x

          if [ "${{ env.ENABLE_WINDOWS_SIGNING }}" = "true" ] && [ "${{ matrix.platform }}" = "windows-latest" ]; then
            # Use forward slashes so the path is safe inside the JSON signCommand.
            WS="${GITHUB_WORKSPACE//\\//}"
            node .github/scripts/update-tauri-config.ts \
            --tag "$TAG" \
            --sign "pwsh -NoProfile -ExecutionPolicy Bypass -File ${WS}/.github/scripts/sign-codesigntool.ps1 %1"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            node .github/scripts/update-tauri-config.ts \
            --tag "$TAG" \
            --sign ""
          else
            node .github/scripts/update-tauri-config.ts \
            --tag "$TAG"
          fi

      - name: Setup CodeSignTool (SSL.com eSigner)
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' && matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          # Windows build bundles its own JRE, so no separate Java setup is needed.
          $version = "v1.3.2"
          # SHA256 of the official CodeSignTool-v1.3.2-windows.zip asset, pinned for supply-chain integrity.
          $expectedSha256 = "4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b"
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/$version/CodeSignTool-$version-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "codesigntool"
          Write-Host "Downloading CodeSignTool $version ..."
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "CodeSignTool checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bat = Get-ChildItem -Path $dest -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat not found after extracting $url" }
          "CODESIGNTOOL_DIR=$($bat.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CODESIGNTOOL_DIR=$($bat.Directory.FullName)"

      - name: Setup Apple API Key for notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "$KEY_DIR"
          APPLE_API_KEY_PATH="$KEY_DIR/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      # Generate THIRD_PARTY_LICENSES file
      # Generate here to include in Tauri build bundle
      - name: Install cargo-license
        run: cargo install cargo-license

      # Keep this feature set aligned with the release build. duckdb-archive is
      # intentionally omitted until the production migration in #2090 lands.
      - name: Generate THIRD_PARTY_NOTICES
        run: node --experimental-strip-types .github/scripts/generate-licenses.ts tmp

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ES_USERNAME: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' && matrix.platform == 'windows-latest' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' && matrix.platform == 'windows-latest' && secrets.ES_PASSWORD || '' }}
          ES_TOTP_SECRET: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' && matrix.platform == 'windows-latest' && secrets.ES_TOTP_SECRET || '' }}
          CREDENTIAL_ID: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' && matrix.platform == 'windows-latest' && secrets.CREDENTIAL_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Upload THIRD_PARTY_NOTICES.md
        run: |
          mv ./tmp/THIRD_PARTY_NOTICES.md ./tmp/THIRD_PARTY_NOTICES_${{ matrix.os-name }}.md
          gh release upload "${{ github.ref_name }}" ./tmp/THIRD_PARTY_NOTICES_${{ matrix.os-name }}.md --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Cleanup Apple API Key
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/private_keys"

  release-provenance:
    needs: publish-tauri
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          for attempt in 1 2 3 4 5; do
            if gh release download "${{ github.ref_name }}" --dir dist --clobber; then
              break
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Failed to download release assets after ${attempt} attempts." >&2
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

          rm -f dist/SHA256SUMS.txt

      - name: Check release asset inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "${{ github.ref_name }}" \
            --json assets \
            --jq '.assets[].name' \
            | awk '$0 != "SHA256SUMS.txt"' \
            | LC_ALL=C sort > "${RUNNER_TEMP}/expected-release-assets.txt"

          find dist -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec basename {} \; \
            | LC_ALL=C sort > "${RUNNER_TEMP}/downloaded-release-assets.txt"

          if [ ! -s "${RUNNER_TEMP}/expected-release-assets.txt" ]; then
            echo "No release assets found on the draft release." >&2
            exit 1
          fi

          if ! diff -u "${RUNNER_TEMP}/expected-release-assets.txt" "${RUNNER_TEMP}/downloaded-release-assets.txt"; then
            echo "Downloaded assets do not match the draft release asset inventory." >&2
            exit 1
          fi

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: bash .github/scripts/generate-release-checksums.sh dist

      - name: Check checksum coverage
        shell: bash
        run: |
          set -euo pipefail

          sed -E 's/^[0-9a-f]{64}  //' dist/SHA256SUMS.txt \
            | LC_ALL=C sort > "${RUNNER_TEMP}/checksummed-release-assets.txt"

          if ! diff -u "${RUNNER_TEMP}/downloaded-release-assets.txt" "${RUNNER_TEMP}/checksummed-release-assets.txt"; then
            echo "SHA256SUMS.txt does not cover every downloaded release asset." >&2
            exit 1
          fi

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" dist/SHA256SUMS.txt --clobber

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
